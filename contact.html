  <link rel="stylesheet" href="contact.css">
</head>

<body>

<header class="contact-header">

  <div class="header-container">

    <a href="index.html" class="logo">JB</a>

    <nav>
      <a href="about.html">sobre</a>
      <a href="projects.html">projetos</a>
      <a href="#">blog</a>
      <a href="contact.html" class="active">contato</a>
    </nav>

  </div>

</header>

<section class="contact-hero">

  <div class="contact-left">

    <h1>Contato</h1>

    <p>
      Entre em contato comigo pelas redes sociais
      ou envie uma mensagem diretamente.
    </p>

    <div class="social-grid">

      

      <a href="https://www.linkedin.com/in/josue-beuren/" class="social-card linkedin">
        <span>in</span>
        <p>LinkedIn</p>
      </a>

      <a href="https://www.instagram.com/emaxter123456/" class="social-card instagram">
        <span>◎</span>
        <p>Instagram</p>
      </a>

      <a href="shttps://discord.com/channels/@me" class="social-card discord">
        <span>🎮</span>
        <p>Discord</p>
      </a>

      

    </div>

  </div>

  <div class="contact-right">

    <img src="assets/foto2.png" alt="Foto contato">

  </div>

</section>

<section class="contact-form-section">

  <div class="form-container">

    <h2>Me envie um email</h2>

    <form>

      <div class="form-grid">

        <div class="input-group">

          <label>Nome</label>

          <input type="text">

          <label>Email</label>

          <input type="email">

        </div>

        <div class="input-group">

          <label>Mensagem</label>

          <textarea></textarea>

        </div>

      </div>

      <button type="submit">Enviar email</button>

    </form>

  </div>

</section>

<footer class="contact-footer">

  <div class="footer-container">

    <p>© 2026 Josué Beuren</p>

    <nav>
      <a href="about.html">sobre</a>

    </nav>

  </div>

</footer>
