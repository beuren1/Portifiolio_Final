<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JB | Contato</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="contact.css">

  <script src="script.js" defer></script>
</head>

<body>

<header id="header">

  <div class="header-inner">

    <a href="index.html" class="logo">JB</a>

    <nav class="main-nav">
      <a href="about.html" data-i18n="navAbout">sobre</a>
      <a href="projects.html" data-i18n="navProjects">projetos</a>
      <a href="contact.html" class="active" data-i18n="navContact">contato</a>
    </nav>

    <div class="header-actions">
      <button class="lang-btn">PT / EN</button>

      <a href="#" class="social-link">in</a>
      <a href="#" class="social-link">f</a>
      <a href="#" class="social-link">w</a>
    </div>

  </div>

</header>

<section class="contact-hero">

  <div class="contact-left">

    <h1 data-i18n="contactTitle">Contato</h1>

    <p data-i18n="contactText">
      Entre em contato comigo pelas redes sociais
      ou envie uma mensagem diretamente.
    </p>

    <div class="social-grid">

      <a href="https://www.linkedin.com/in/josue-beuren/" target="_blank" class="social-card linkedin">
        <span>in</span>
        <p>LinkedIn</p>
      </a>

      <a href="https://www.instagram.com/emaxter123456/" target="_blank" class="social-card instagram">
        <span>◎</span>
        <p>Instagram</p>
      </a>

      <a href="https://discord.com/" target="_blank" class="social-card discord">
        <span>🎮</span>
        <p>Discord</p>
      </a>

    </div>

  </div>

  <div class="contact-right">

    <img src="assets/foto2.png" alt="Foto contato">

  </div>

</section>

<section class="contact-form-section">

  <div class="form-container">

    <h2 data-i18n="emailTitle">Me envie um email</h2>

    <form>

      <div class="form-grid">

        <div class="input-group">

          <label data-i18n="nameLabel">Nome</label>
          <input type="text" data-i18n-placeholder="namePlaceholder" placeholder="Seu nome">

          <label data-i18n="emailLabel">Email</label>
          <input type="email" data-i18n-placeholder="emailPlaceholder" placeholder="Seu email">

        </div>

        <div class="input-group">

          <label data-i18n="messageLabel">Mensagem</label>

          <textarea data-i18n-placeholder="messagePlaceholder" placeholder="Digite sua mensagem"></textarea>

        </div>

      </div>

      <button type="submit" data-i18n="sendButton">Enviar email</button>

    </form>

  </div>

</section>

<footer id="footer">

  <div class="footer-inner">

    <p>© 2026 Josué Beuren</p>

    <div class="footer-nav">
      <a href="about.html" data-i18n="navAbout">sobre</a>
      <a href="projects.html" data-i18n="navProjects">projetos</a>
      <a href="#" data-i18n="navBlog">blog</a>
      <a href="contact.html" data-i18n="navContact">contato</a>
    </div>

  </div>

</footer>

</body>
</html>
